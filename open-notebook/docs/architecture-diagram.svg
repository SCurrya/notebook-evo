<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Segoe UI', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" fill="url(#bg)"/>
  <text x="60" y="48" font-size="28" font-weight="700" fill="#e2e8f0">Notebook-Evo 系统架构</text>
  <text x="60" y="74" font-size="14" fill="#94a3b8">隐私优先 · 多模型 · 可自托管的 AI 知识工作台</text>

  <!-- Client Layer -->
  <rect x="40" y="100" width="340" height="110" rx="12" fill="url(#card)" stroke="#475569"/>
  <text x="60" y="130" font-size="16" font-weight="600" fill="#c7d2fe">📱 客户端层</text>
  <rect x="60" y="142" width="140" height="52" rx="8" fill="#334155" stroke="#475569"/>
  <text x="72" y="164" font-size="12" fill="#e2e8f0">Web App</text>
  <text x="72" y="182" font-size="10" fill="#94a3b8">Next.js 16 · i18n</text>
  <rect x="210" y="142" width="150" height="52" rx="8" fill="#334155" stroke="#475569"/>
  <text x="222" y="164" font-size="12" fill="#e2e8f0">Mobile / PWA</text>
  <text x="222" y="182" font-size="10" fill="#94a3b8">Capacitor · 二维码分享</text>

  <!-- API Layer -->
  <rect x="440" y="100" width="320" height="110" rx="12" fill="url(#card)" stroke="#475569"/>
  <text x="460" y="130" font-size="16" font-weight="600" fill="#c7d2fe">🔌 API 层</text>
  <text x="460" y="154" font-size="12" fill="#e2e8f0">FastAPI · REST + SSE 流式</text>
  <text x="460" y="176" font-size="11" fill="#94a3b8">密码认证 · SSRF 防护 · Swagger 保护</text>
  <text x="460" y="196" font-size="11" fill="#94a3b8">Eval 服务 · 多智能体调度 · MCP Server</text>

  <!-- Core Layer -->
  <rect x="40" y="260" width="720" height="200" rx="12" fill="url(#card)" stroke="#475569"/>
  <text x="60" y="290" font-size="16" font-weight="600" fill="#c7d2fe">🧠 核心引擎</text>

  <rect x="60" y="304" width="210" height="70" rx="8" fill="#334155" stroke="#6366f1"/>
  <text x="76" y="326" font-size="12" font-weight="600" fill="#a5b4fc">🔍 混合检索</text>
  <text x="76" y="344" font-size="10" fill="#94a3b8">BM25 + 向量 + RRF 融合</text>
  <text x="76" y="360" font-size="10" fill="#94a3b8">中文 BM25 · HyDE · Rerank</text>

  <rect x="290" y="304" width="210" height="70" rx="8" fill="#334155" stroke="#6366f1"/>
  <text x="306" y="326" font-size="12" font-weight="600" fill="#a5b4fc">🕸️ 知识图谱</text>
  <text x="306" y="344" font-size="10" fill="#94a3b8">实体关系提取 · 图可视化</text>
  <text x="306" y="360" font-size="10" fill="#94a3b8">GraphRAG 推理增强</text>

  <rect x="520" y="304" width="220" height="70" rx="8" fill="#334155" stroke="#6366f1"/>
  <text x="536" y="326" font-size="12" font-weight="600" fill="#a5b4fc">🤖 RAG 问答</text>
  <text x="536" y="344" font-size="10" fill="#94a3b8">LangGraph · 策略/回答/总结</text>
  <text x="536" y="360" font-size="10" fill="#94a3b8">跨 Provider 降级链</text>

  <rect x="60" y="386" width="210" height="58" rx="8" fill="#334155" stroke="#6366f1"/>
  <text x="76" y="408" font-size="12" font-weight="600" fill="#a5b4fc">📊 RAG 评估</text>
  <text x="76" y="426" font-size="10" fill="#94a3b8">RAGAS 四维指标 · 报告</text>

  <rect x="290" y="386" width="210" height="58" rx="8" fill="#334155" stroke="#6366f1"/>
  <text x="306" y="408" font-size="12" font-weight="600" fill="#a5b4fc">🔄 异步任务</text>
  <text x="306" y="426" font-size="10" fill="#94a3b8">嵌入 · 处理 · 转换 · 播客</text>

  <rect x="520" y="386" width="220" height="58" rx="8" fill="#334155" stroke="#6366f1"/>
  <text x="536" y="408" font-size="12" font-weight="600" fill="#a5b4fc">🧩 多智能体</text>
  <text x="536" y="426" font-size="10" fill="#94a3b8">持久化 · DAG 依赖 · MCP 暴露</text>

  <!-- Storage -->
  <rect x="820" y="100" width="340" height="360" rx="12" fill="url(#card)" stroke="#475569"/>
  <text x="840" y="130" font-size="16" font-weight="600" fill="#c7d2fe">💾 存储层</text>

  <rect x="840" y="146" width="300" height="120" rx="8" fill="#334155" stroke="#f59e0b"/>
  <text x="856" y="168" font-size="12" font-weight="600" fill="#fcd34d">SurrealDB（文档+图+向量）</text>
  <text x="856" y="188" font-size="10" fill="#94a3b8">笔记本 · 来源 · 笔记 · 洞察</text>
  <text x="856" y="206" font-size="10" fill="#94a3b8">图谱关系 · 向量索引 · 会话</text>
  <text x="856" y="224" font-size="10" fill="#94a3b8">BM25 全文索引（含中文兜底）</text>

  <rect x="840" y="278" width="300" height="62" rx="8" fill="#334155" stroke="#10b981"/>
  <text x="856" y="300" font-size="12" font-weight="600" fill="#6ee7b7">上传文件</text>
  <text x="856" y="318" font-size="10" fill="#94a3b8">PDF · 图片 · 文本（PyMuPDF OCR）</text>

  <rect x="840" y="352" width="300" height="92" rx="8" fill="#334155" stroke="#06b6d4"/>
  <text x="856" y="374" font-size="12" font-weight="600" fill="#67e8f9">自动备份</text>
  <text x="856" y="392" font-size="10" fill="#94a3b8">每日计划任务 · 保留最近 5 份</text>
  <text x="856" y="410" font-size="10" fill="#94a3b8">数据库 + 文件 + 配置脱敏</text>

  <!-- Model Layer -->
  <rect x="40" y="520" width="1120" height="150" rx="12" fill="url(#card)" stroke="#475569"/>
  <text x="60" y="550" font-size="16" font-weight="600" fill="#c7d2fe">🤖 模型层（跨 Provider 自动降级）</text>
  <text x="60" y="572" font-size="11" fill="#94a3b8">MODEL_PROVIDER_PRIORITY 可配置 · 启动探测 · 冷却缓存跳过失效渠道</text>

  <rect x="60" y="588" width="200" height="62" rx="8" fill="#334155" stroke="#8b5cf6"/>
  <text x="76" y="610" font-size="12" font-weight="600" fill="#c4b5fd">SenseNova</text>
  <text x="76" y="630" font-size="10" fill="#94a3b8">deepseek-v4-flash · 6.7-flash-lite</text>

  <rect x="280" y="588" width="200" height="62" rx="8" fill="#334155" stroke="#8b5cf6"/>
  <text x="296" y="610" font-size="12" font-weight="600" fill="#c4b5fd">xcode.best</text>
  <text x="296" y="630" font-size="10" fill="#94a3b8">gpt-5.6-luna · gpt-5.4-mini</text>

  <rect x="500" y="588" width="200" height="62" rx="8" fill="#334155" stroke="#8b5cf6"/>
  <text x="516" y="610" font-size="12" font-weight="600" fill="#c4b5fd">OpenRouter</text>
  <text x="516" y="630" font-size="10" fill="#94a3b8">Free 模型兜底 · embedding</text>

  <rect x="720" y="588" width="200" height="62" rx="8" fill="#334155" stroke="#8b5cf6"/>
  <text x="736" y="610" font-size="12" font-weight="600" fill="#c4b5fd">OpenAI 兼容</text>
  <text x="736" y="630" font-size="10" fill="#94a3b8">本地 Ollama · 任意端点</text>

  <rect x="940" y="588" width="200" height="62" rx="8" fill="#334155" stroke="#8b5cf6"/>
  <text x="956" y="610" font-size="12" font-weight="600" fill="#c4b5fd">更多</text>
  <text x="956" y="630" font-size="10" fill="#94a3b8">Anthropic · DeepSeek · Gemini…</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>
  <line x1="380" y1="155" x2="438" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="155" x2="818" y2="155" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="400" y1="210" x2="400" y2="258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="360" x2="838" y2="360" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="460" x2="600" y2="518" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="60" y="745" font-size="11" fill="#64748b">FastAPI · Next.js 16 · SurrealDB · LangGraph · 360+ 单元测试 · CI · Docker</text>
  <text x="60" y="763" font-size="11" fill="#64748b">Security: SSRF/DNS-rebinding · SQL 注入 · 模板注入 · 恒时密码认证</text>
</svg>
